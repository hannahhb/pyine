# @package _global_

defaults:
  - guardrail/decision_model_eval_base
  - _self_

runtime:
  run_name: "${config.guardrail_config.provider.model}/${config.guardrail_config.prompt_version}/${now:%Y%m%d_%H%M%S}"

config:
  guardrail_config:
    provider:
      backend: typesafe_systemone
      base_url: https://api.typesafe.ai
      api_key_env: TYPESAFE_API_KEY
      model: jev-1.13.0
      timeout_seconds: 60
      max_retries: 3
      require_token_usage: true
