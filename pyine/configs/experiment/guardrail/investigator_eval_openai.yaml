# @package _global_
#
# Fixed-question investigator: hosted OpenAI-compatible investigator, vLLM-served responder.
#
# Usage:
#   python -m pyine.apps.guardrail_eval.investigator_eval \
#       +experiment=guardrail/investigator_eval_openai

defaults:
  - guardrail/investigator_eval_base
  - _self_

runtime:
  run_name: "${config.guardrail_config.investigator_provider.model_kwargs.model}/${now:%Y%m%d_%H%M%S}"

config:
  guardrail_config:
    investigator_provider:
      provider: openai
      model_kwargs:
        model: gpt-5-mini
        max_tokens: 4096
      rate_limiter_config:
        requests_per_second: 30
        max_bucket_size: 30
    responder_provider:
      provider: vllm
      model_kwargs:
        model: ${oc.env:PYINE_RL_MODEL_NAME}
        base_url: ${oc.env:VLLM_BASE_URL,http://localhost:8000/v1}
        temperature: 0.0
        max_tokens: 2048
