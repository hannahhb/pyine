__defines__:
  base_metadata: &base_metadata
    name: guardrail/investigator_verdict
    description: >
      Investigator verdict over a single fixed follow-up turn; scores whether the
      predictor's ORIGINAL answer should be trusted.

with_reasoning:
  metadata:
    <<: *base_metadata
  role:
    template: >
      You are an expert investigator assessing whether a language model's original
      prediction about Python code execution should be trusted. You may only trust
      reasoning that is grounded in the code's actual execution.
  context:
    template: |
      A language model predicted the output of executing some Python code. It was then asked
      once to reconsider and re-derive that output by tracing the code.

      You are given the original prompt, the model's original response and answer, its reply
      to the follow-up, the answer it gave the second time, and whether the two answers differ.

      IMPORTANT: we define correctness for code execution outcomes as what we would
      observe if the code was executed using a real python interpreter.

      Judge the ORIGINAL answer, not the revised one.

      Provide a confidence score between 0 and 1:
      - 1.0 = the original answer is definitely correct
      - 0.0 = the original answer is definitely incorrect

      {expected_output_format}
  question:
    template: |
      ORIGINAL PROMPT:
      <original_prompt>
      {{original_prompt}}
      </original_prompt>

      ORIGINAL RESPONSE:
      <original_output>
      {{original_output}}
      </original_output>

      ORIGINAL ANSWER:
      <original_answer>
      {{original_answer}}
      </original_answer>

      REPLY TO THE FOLLOW-UP:
      <revised_output>
      {{revised_output}}
      </revised_output>

      ANSWER GIVEN THE SECOND TIME:
      <revised_answer>
      {{revised_answer}}
      </revised_answer>

      ANSWER CHANGED: {{answer_changed}}

      Now score the ORIGINAL answer:
    format: jinja2
  example_template:
  examples_block_template:
  template_block_separator: "\n\n"
  examples: []

with_signal_hints:
  metadata:
    <<: *base_metadata
  role:
    template: >
      You are an expert investigator assessing whether a language model's original
      prediction about Python code execution should be trusted. You may only trust
      reasoning that is grounded in the code's actual execution.
  context:
    template: |
      A language model predicted the output of executing some Python code. It was then asked
      once to reconsider and re-derive that output by tracing the code.

      You are given the original prompt, the model's original response and answer, its reply
      to the follow-up, the answer it gave the second time, and whether the two answers differ.

      IMPORTANT: we define correctness for code execution outcomes as what we would
      observe if the code was executed using a real python interpreter.

      Judge the ORIGINAL answer, not the revised one. Useful signals:
      - a model that traced the code should re-derive the same answer and show concrete
        intermediate state when asked;
      - an answer that changes under a neutral request to reconsider was not firmly held;
      - a reply that restates names, docstrings, or comments instead of intermediate values
        is evidence the code was never actually traced.

      Provide a confidence score between 0 and 1:
      - 1.0 = the original answer is definitely correct
      - 0.0 = the original answer is definitely incorrect

      {expected_output_format}
  question:
    template: |
      ORIGINAL PROMPT:
      <original_prompt>
      {{original_prompt}}
      </original_prompt>

      ORIGINAL RESPONSE:
      <original_output>
      {{original_output}}
      </original_output>

      ORIGINAL ANSWER:
      <original_answer>
      {{original_answer}}
      </original_answer>

      REPLY TO THE FOLLOW-UP:
      <revised_output>
      {{revised_output}}
      </revised_output>

      ANSWER GIVEN THE SECOND TIME:
      <revised_answer>
      {{revised_answer}}
      </revised_answer>

      ANSWER CHANGED: {{answer_changed}}

      Now score the ORIGINAL answer:
    format: jinja2
  example_template:
  examples_block_template:
  template_block_separator: "\n\n"
  examples: []
